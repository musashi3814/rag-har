# PAMAP2 (Physical Activity Monitoring) Dataset Configuration
# Preprocessing is implemented in providers/pamap2/provider.py

dataset_name: "pamap2"
description: "PAMAP2 Physical Activity Monitoring - Multi-sensor IMU data from hand, chest, and ankle"

# Data source configuration
data_source:
  folder_path: "/app/data/PAMAP2_Dataset/Protocol" # Directory containing subject*.dat files
  # Activity labels
  activities:
    - lying
    - sitting
    - standing
    - walking
    - running
    - cycling
    - nordic_walking
    - ascending_stairs
    - descending_stairs
    - vacuum_cleaning
    - ironing
    - rope_jumping

# Preprocessing configuration
preprocessing:
  window_size: 200 # Window size in samples (2 seconds at 100Hz) - matches paper §V-A2
  step_size: 50 # Step size in samples (0.5 seconds, 75% overlap) - matches paper §V-A2
  sampling_rate: 100 # Sampling rate in Hz

# Train/Test split configuration
train_test_split:
  method: "one_subject_out" # Split method: one_subject_out
  test_subject_id: "103" # Subject ID to use for test set
  data_dir: "output/pamap2/windows" # Directory containing preprocessed CSV windows
  output_dir: "output/pamap2/train-test-splits" # Output directory for train/test splits

# Feature extraction configuration
# Sensors: 3 IMUs (hand, chest, ankle)
# Each IMU: acc16_{x,y,z}, gyro_{x,y,z}, mag_{x,y,z}
features:
  statistics:
    - mean
    - std
    - min
    - max
    - median
    - p25
    - p75
    - peaks

# Embedding configuration
embedding:
  provider: "local"       # "openai" | "local"
  model: "BAAI/bge-m3"  # local: "BAAI/bge-m3" etc.
  device: "cpu"            # "cpu" | "cuda" — vLLMとGPU共有の場合はcpu推奨
  max_workers: 1           # parallel embed workers
  batch_size: 5            # texts per embed batch

# LLM configuration
llm:
  provider: "local"        # "openai" | "local"
  model: "Qwen/Qwen3.5-9B"
  base_url: http://vllm:8000/v1          # Docker Compose: use service name. For local run: http://localhost:8000/v1
  max_tokens: 64                         # Output tokens (activity label only)
  max_context_tokens: 74440              # Must match vLLM --max-model-len
  # api_key: null           # Override for local provider

# Classification prompts configuration
prompts:
  system_prompt: |
    Analyze all the given LABELLED SAMPLES and the CANDIDATE statistics, and give the activity label that the CANDIDATE closely resembles from the LABELLED SAMPLES. Respond with only the activity label from the following classes: {classes}

  user_prompt: |
    You are given summary statistics for sensor data across temporal segments for labeled samples and one unlabeled candidate.

    --- CANDIDATE ---
    {candidate_series}

    --- LABELED SAMPLES ---
    {retrieved_data}
